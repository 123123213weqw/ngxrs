[package]
name = "ngxrs"
version = "0.1.0"
edition = "2021"
description = "nginx-compatible high-performance web server"
license = "BSD-2-Clause"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "sync", "macros"] }
libc = "0.2"
memchr = "2.7"
socket2 = { version = "0.5", features = ["all"] }
regex = "1.11"
flate2 = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2.1"
# Decrypts `BEGIN ENCRYPTED PRIVATE KEY` (PKCS#8 PBES2), which is what
# `ssl_password_file` exists for.
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
# HTTP/3: QUIC transport + the h3/QPACK layer on top.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
# Already present transitively via rustls; used directly to validate client
# certificate chains against `ssl_client_certificate`.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
h2 = "0.4"
http = "1"
bytes = "1"

[features]
# Counts global allocations. Measurement only: it perturbs the hot path, so it
# must never be enabled in a benchmark build.
alloc-count = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
