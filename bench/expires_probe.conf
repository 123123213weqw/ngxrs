worker_processes 1;
daemon off;
error_log /tmp/nextup/exp_err.log warn;
pid /tmp/nextup/exp.pid;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 127.0.0.1:28000;
        location /off { expires off; return 200; }
        location /epoch { expires epoch; return 200; }
        location /max { expires max; return 200; }
        location /500 { expires 500; return 200; }
        location /1h { expires 1h; return 200; }
        location /at { expires @15h; return 200; }
        location /atm { expires @15h30m; return 200; }
        location /mod { expires modified +1h; return 200; }
        location /neg { expires -1h; return 200; }
        location /up { expires 1h; proxy_pass http://127.0.0.1:28001/cc; }
    }
    server {
        listen 127.0.0.1:28001;
        location /cc { add_header Cache-Control "public, max-age=99" always; return 200 "x"; }
    }
}
