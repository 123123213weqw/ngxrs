worker_processes 8;
daemon off;
pid __ROOT__/bench/run/fcgi.pid;
error_log __ROOT__/bench/run/fcgi-error.log warn;

events { worker_connections 4096; }

http {
    include __ROOT__/conf/mime.types;
    default_type application/octet-stream;
    access_log off;

    server {
        listen 19500;
        server_name _;
        root __ROOT__/bench/www;

        location /fcgi/ {
            fastcgi_pass 127.0.0.1:19600;
            fastcgi_index index.php;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        }

        location /fcgi2/ {
            fastcgi_pass 127.0.0.1:19601;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
        }

        location /fcgi3/ {
            fastcgi_pass 127.0.0.1:19602;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        }

        location /fcgi4/ {
            fastcgi_pass 127.0.0.1:19603;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_LENGTH $content_length;
        }
    }
}

stream {
    upstream tcp_backend {
        server 127.0.0.1:19610;
    }

    server {
        listen 19510;
        proxy_pass tcp_backend;
        proxy_timeout 10s;
    }

    server {
        listen 19520 udp;
        proxy_pass 127.0.0.1:19611;
        proxy_timeout 5s;
    }
}
