worker_processes auto;
daemon off;
pid __ROOT__/bench/run/feature.pid;
error_log __ROOT__/bench/run/feature-error.log warn;

events { worker_connections 65535; }

http {
    include __ROOT__/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    access_log off;

    upstream backend {
        server 127.0.0.1:19201;
        server 127.0.0.1:19202;
        keepalive 32;
    }

    upstream backend_least {
        least_conn;
        server 127.0.0.1:19201;
        server 127.0.0.1:19202;
    }

    upstream backend_iphash {
        ip_hash;
        server 127.0.0.1:19201;
        server 127.0.0.1:19202;
    }

    gzip on;
    gzip_min_length 100;
    gzip_types text/plain text/css application/json application/javascript;

    server {
        listen 19300;
        server_name _;
        root __ROOT__/bench/www;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        error_page 418 =200 /teapot.html;

        location / { }

        location /plain/ {
            gzip off;
            alias __ROOT__/bench/www/plain/;
        }

        location /gzip/ {
            gzip on;
            gzip_comp_level 6;
            alias __ROOT__/bench/www/gzip/;
        }

        location = /404.html { internal; }
        location = /50x.html { internal; }
        location = /teapot { return 418 "teapot\n"; }
        location = /teapot.html { internal; return 200 "teapot page\n"; }

        location /p/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /least/ {
            proxy_pass http://backend_least/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /iphash/ {
            proxy_pass http://backend_iphash/;
        }

        location /direct/ {
            proxy_pass http://127.0.0.1:19201/;
        }

        # ---- rewrite ----
        location /rw/ {
            rewrite ^/rw/old/(.*)$ /rw/new/$1 last;
            rewrite ^/rw/perm/(.*)$ /rw/new/$1 permanent;
            rewrite ^/rw/tmp/(.*)$ /rw/new/$1 redirect;
            return 200 "rw-fallthrough\n";
        }
        location /rw/new/ {
            rewrite ^/rw/new/(.*)$ /rw/final/$1 break;
            return 200 "new-branch\n";
        }
        location /rw/final/ {
            return 200 "final\n";
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:19201/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
