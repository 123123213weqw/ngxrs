worker_processes 1;
daemon off;
error_log /tmp/nextup/hashprobe_err.log warn;
pid /tmp/nextup/hashprobe.pid;
events { worker_connections 1024; }
http {
    access_log off;
    upstream u  { hash $arg_a; server 127.0.0.1:28001; server 127.0.0.1:28002; server 127.0.0.1:28003; }
    upstream c  { hash $arg_a consistent; server 127.0.0.1:28001; server 127.0.0.1:28002; server 127.0.0.1:28003; }
    upstream c2 { hash $arg_a consistent; server 127.0.0.1:28001; server 127.0.0.1:28003; }
    upstream cw  { hash $arg_a consistent; server 127.0.0.1:28001; server 127.0.0.1:28002; server 127.0.0.1:28003 weight=10; }
    upstream cw2 { hash $arg_a consistent; server 127.0.0.1:28001; server 127.0.0.1:28003 weight=10; }
    server {
        listen 127.0.0.1:28000;
        location /u/  { proxy_pass http://u/; }
        location /c/  { proxy_pass http://c/; }
        location /c2/ { proxy_pass http://c2/; }
        location /cw/  { proxy_pass http://cw/; }
        location /cw2/ { proxy_pass http://cw2/; }
    }
    server {
        listen 127.0.0.1:28001; add_header X-Port 28001; location / { return 204; } location /502 { return 204; }
    }
    server {
        listen 127.0.0.1:28002; add_header X-Port 28002; location / { return 204; } location /502 { return 204; }
    }
    server {
        listen 127.0.0.1:28003; add_header X-Port 28003; location / { return 204; } location /502 { return 502; }
    }
}
