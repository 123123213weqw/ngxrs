worker_processes 1;
error_log /tmp/nextup/probe_err.log warn;
pid /tmp/nextup/probe_ref.pid;
events { worker_connections 1024; }
http {
    access_log off;
    server {
        listen 127.0.0.1:28000;
        location /g500/ { proxy_pass http://u500/; proxy_next_upstream http_500 error timeout; }
        location /g503/ { proxy_pass http://u503/; proxy_next_upstream http_503 error timeout; }
        location /g403/ { proxy_pass http://u403/; proxy_next_upstream http_403 error timeout; }
        location /g429/ { proxy_pass http://u429/; proxy_next_upstream http_429 error timeout; }
        location /gres/ { proxy_pass http://ureset/; proxy_next_upstream http_500 error timeout; }
        location /gexp/ { proxy_pass http://uexp/; proxy_next_upstream http_500 error timeout; }
        location /goff/ { proxy_pass http://uoff/; proxy_next_upstream off; }
        location /gpost/ { proxy_pass http://upost/; }
    }
    upstream u500  { server 127.0.0.1:28001 max_fails=1 fail_timeout=10s; server 127.0.0.1:28002 backup; }
    upstream u503  { server 127.0.0.1:28001 max_fails=1 fail_timeout=10s; server 127.0.0.1:28002 backup; }
    upstream u403  { server 127.0.0.1:28001 max_fails=1 fail_timeout=10s; server 127.0.0.1:28002 backup; }
    upstream u429  { server 127.0.0.1:28001 max_fails=1 fail_timeout=10s; server 127.0.0.1:28002 backup; }
    upstream ureset { server 127.0.0.1:28001 max_fails=2 fail_timeout=60s; server 127.0.0.1:28002 backup; }
    upstream uexp  { server 127.0.0.1:28001 max_fails=1 fail_timeout=2s; server 127.0.0.1:28002 backup; }
    upstream uoff  { server 127.0.0.1:28003; server 127.0.0.1:28002 backup; }
    upstream upost { server 127.0.0.1:28003; server 127.0.0.1:28002 backup; }
    server {
        listen 127.0.0.1:28001;
        location /aok  { return 200 "AND-THIS\n"; }
        location /a500 { return 500; }
        location /a503 { return 503; }
        location /a403 { return 403; }
        location /a429 { return 429; }
    }
    server {
        listen 127.0.0.1:28002;
        location / { return 200 "TEST-OK\n"; }
    }
}
