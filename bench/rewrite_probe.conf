worker_processes 1;
daemon off;
error_log /tmp/nextup/rw_err.log warn;
pid /tmp/nextup/rw.pid;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 127.0.0.1:28000;
        server_name localhost;
        location / { rewrite ^ http://example.com/ redirect; }
        location /add { rewrite ^ http://example.com/?c=d redirect; }
        location /no { rewrite ^ http://example.com/?c=d? redirect; }
        location /return204 { return 204; }
        location /return200 { return 200; }
        location /return405 { return 405; }
        location /error404return405 { error_page 404 /return405; return 404; }
        location /error405return204 { error_page 405 /return204; return 405; }
        location /error405return200 { error_page 405 /return200; return 405; }
        location /return200text { return 200 "text"; }
        location /return302text { return 302 "text"; }
        location /error405return200text { error_page 405 /return200text; return 405; }
        location /error302return200text { error_page 302 /return200text; return 302 "text"; }
        location /error405return302text { error_page 405 /return302text; return 405; }
        location /capture {
            rewrite ^(.*) $1?c=d;
            return 200 "uri:$uri args:$args";
        }
        location /capturedup {
            rewrite ^(.*) $1?c=$1;
            return 200 "uri:$uri args:$args";
        }
        location /break {
            rewrite ^ /return200;
            break;
            proxy_pass http://127.0.0.1:28000/return204;
        }
    }
}
