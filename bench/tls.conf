worker_processes __WORKERS__;
daemon off;
pid __ROOT__/bench/run/tls.pid;
error_log __ROOT__/bench/run/tls-error.log warn;

events { worker_connections 65535; }

http {
    include __ROOT__/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    access_log off;

    # default server: certificate for the fallback case
    server {
        listen 19443 ssl http2;
        server_name default.example;
        ssl_certificate     __ROOT__/bench/certs/default.crt;
        ssl_certificate_key __ROOT__/bench/certs/default.key;
        root __ROOT__/bench/www;
        location / { }
        location = /who { return 200 "default\n"; }
    }

    # SNI: exact name
    server {
        listen 19443 ssl http2;
        server_name exact.example;
        ssl_certificate     __ROOT__/bench/certs/exact.crt;
        ssl_certificate_key __ROOT__/bench/certs/exact.key;
        location = /who { return 200 "exact\n"; }
    }

    # SNI: wildcard
    server {
        listen 19443 ssl http2;
        server_name *.wild.example;
        ssl_certificate     __ROOT__/bench/certs/wild.crt;
        ssl_certificate_key __ROOT__/bench/certs/wild.key;
        location = /who { return 200 "wild\n"; }
    }
}
